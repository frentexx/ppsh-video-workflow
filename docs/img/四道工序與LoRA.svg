<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img">
<title>生成一支影片的四道工序與各種 LoRA 的位置</title>
<desc>流程分四步：寫角色外觀、生定妝照與首幀、H3 生成影片、放大與配樂。人物一致性在第二步決定，DMAD 加速 LoRA 只作用在第三步。</desc>
<style>
.ti { font: 500 15px 'Microsoft JhengHei','PingFang TC',sans-serif; }
.tx { font: 400 13px 'Microsoft JhengHei','PingFang TC',sans-serif; }
.hd { font: 500 17px 'Microsoft JhengHei','PingFang TC',sans-serif; }
.nt { font: 400 13px 'Microsoft JhengHei','PingFang TC',sans-serif; fill:#5F5E5A; }
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="900" height="560" fill="#FFFFFF"/>

<text class="hd" x="40" y="42" fill="#2C2C2A">四道工序</text>

<g>
<rect x="40" y="60" width="180" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ti" x="130" y="88" text-anchor="middle" fill="#2C2C2A">1　寫角色外觀</text>
<text class="tx" x="130" y="109" text-anchor="middle" fill="#5F5E5A">純文字，不用顯卡</text>
</g>

<g>
<rect x="250" y="60" width="180" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ti" x="340" y="88" text-anchor="middle" fill="#04342C">2　生圖</text>
<text class="tx" x="340" y="109" text-anchor="middle" fill="#0F6E56">定妝照、每鏡首幀</text>
</g>

<g>
<rect x="460" y="60" width="180" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="ti" x="550" y="88" text-anchor="middle" fill="#26215C">3　生影片</text>
<text class="tx" x="550" y="109" text-anchor="middle" fill="#534AB7">H3 讓圖動起來、對嘴</text>
</g>

<g>
<rect x="670" y="60" width="180" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ti" x="760" y="88" text-anchor="middle" fill="#2C2C2A">4　後製</text>
<text class="tx" x="760" y="109" text-anchor="middle" fill="#5F5E5A">放大到 1080p、配樂</text>
</g>

<line x1="222" y1="92" x2="246" y2="92" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="432" y1="92" x2="456" y2="92" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="642" y1="92" x2="666" y2="92" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

<text class="hd" x="40" y="186" fill="#2C2C2A">LoRA 掛在哪一道工序</text>

<g>
<rect x="250" y="206" width="180" height="86" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ti" x="340" y="234" text-anchor="middle" fill="#04342C">角色 LoRA</text>
<text class="tx" x="340" y="256" text-anchor="middle" fill="#0F6E56">讓 AI 記住這張臉</text>
<text class="tx" x="340" y="276" text-anchor="middle" fill="#0F6E56">要自己訓練，選用</text>
</g>

<g>
<rect x="460" y="206" width="180" height="86" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="ti" x="550" y="234" text-anchor="middle" fill="#26215C">DMAD 加速 LoRA</text>
<text class="tx" x="550" y="256" text-anchor="middle" fill="#534AB7">少畫幾次就畫完</text>
<text class="tx" x="550" y="276" text-anchor="middle" fill="#534AB7">畫面內容完全不變</text>
</g>

<g>
<rect x="460" y="312" width="180" height="86" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="ti" x="550" y="340" text-anchor="middle" fill="#26215C">動作／風格 LoRA</text>
<text class="tx" x="550" y="362" text-anchor="middle" fill="#534AB7">打鬥、特殊運鏡</text>
<text class="tx" x="550" y="382" text-anchor="middle" fill="#534AB7">本片用不到</text>
</g>

<line x1="340" y1="128" x2="340" y2="202" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="550" y1="128" x2="550" y2="202" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="550" y1="296" x2="550" y2="308" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

<g>
<rect x="40" y="206" width="180" height="86" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="ti" x="130" y="234" text-anchor="middle" fill="#412402">人物一致</text>
<text class="tx" x="130" y="256" text-anchor="middle" fill="#854F0B">在第 2 步就決定</text>
<text class="tx" x="130" y="276" text-anchor="middle" fill="#854F0B">不是第 3 步</text>
</g>

<line x1="222" y1="249" x2="246" y2="249" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>

<text class="hd" x="40" y="446" fill="#2C2C2A">定妝照與訓練圖的分工</text>

<g>
<rect x="40" y="464" width="240" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ti" x="160" y="490" text-anchor="middle" fill="#04342C">定妝照　1 張、半身</text>
<text class="tx" x="160" y="510" text-anchor="middle" fill="#0F6E56">灰底正面，人工挑定後不再換</text>
</g>

<g>
<rect x="330" y="464" width="240" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ti" x="450" y="490" text-anchor="middle" fill="#04342C">訓練圖　25 張、程式產</text>
<text class="tx" x="450" y="510" text-anchor="middle" fill="#0F6E56">含全身與各角度，要逐張挑</text>
</g>

<g>
<rect x="620" y="464" width="230" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ti" x="735" y="490" text-anchor="middle" fill="#04342C">角色 LoRA</text>
<text class="tx" x="735" y="510" text-anchor="middle" fill="#0F6E56">訓練 1600 步</text>
</g>

<line x1="282" y1="494" x2="326" y2="494" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="572" y1="494" x2="616" y2="494" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

<text class="nt" x="40" y="336">H3 拿到的是一張畫好的圖，</text>
<text class="nt" x="40" y="358">不會重新決定角色長相；</text>
<text class="nt" x="40" y="380">它只負責讓畫面動起來。</text>
</svg>
